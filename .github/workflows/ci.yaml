name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shortener
          POSTGRES_PASSWORD: shortener
          POSTGRES_DB: shortener
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortener -d shortener"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Initialize database schema
        env:
          DATABASE_URL: postgresql+psycopg://shortener:shortener@localhost:5432/shortener
        run: |
          uv run python -c "
          from sqlalchemy import create_engine, text
          from api.database import Base
          engine = create_engine('$DATABASE_URL')
          Base.metadata.create_all(bind=engine)
          "

      - name: Ruff check
        run: uv run ruff check api tests

      - name: Ruff format check
        run: uv run ruff format --check api tests

      - name: Pytest
        env:
          DATABASE_URL: postgresql+psycopg://shortener:shortener@localhost:5432/shortener
        run: uv run pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npx prettier --check "**/*.{ts,tsx,js,json,css,md}" --ignore-path .prettierignore

      - name: Next.js build
        env:
          FASTAPI_INTERNAL_URL: http://api:8000
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build
